name: Supplemental evidence
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supplemental-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Provision Rust
        run: rustup toolchain install 1.87.0 --profile minimal --component rustfmt --component clippy
      - name: Compile and test the supplemental crate
        shell: bash
        run: |
          set -euo pipefail
          mkdir _supplemental-receipts
          rustc +1.87.0 -Vv | tee _supplemental-receipts/rustc.txt
          cargo +1.87.0 test -p gba-supplemental -- --test-threads=2 2>&1 | tee _supplemental-receipts/tests.log
          cargo +1.87.0 build -p gba-supplemental 2>&1 | tee _supplemental-receipts/build.log
          cp Cargo.lock _supplemental-receipts/Cargo.lock
          sha256sum target/debug/gba-supplemental > _supplemental-receipts/binary.sha256
          git rev-parse HEAD > _supplemental-receipts/source-commit.txt
      - name: Collect formatting and lint review evidence
        if: always()
        shell: bash
        run: |
          mkdir -p _supplemental-receipts/toolchain
          cargo +1.87.0 fmt -p gba-supplemental -- --check > _supplemental-receipts/format.log 2>&1 || true
          cargo +1.87.0 clippy -p gba-supplemental --all-targets -- -D warnings > _supplemental-receipts/clippy.log 2>&1 || true
          cp "$(rustup which --toolchain 1.87.0 rustfmt)" _supplemental-receipts/toolchain/rustfmt
          ldd _supplemental-receipts/toolchain/rustfmt > _supplemental-receipts/toolchain/ldd.txt || true
      - name: Provision the offline runner image
        run: |
          docker pull ubuntu:24.04
          docker image inspect ubuntu:24.04 --format '{{.Id}} {{json .RepoDigests}}' > _supplemental-receipts/container.txt
      - name: Execute all qualification controls without network or model keys
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 2g --memory-swap 2g --cpus 2 --pids-limit 64 --tmpfs /tmp:rw,noexec,nosuid,size=64m --user "$(id -u):$(id -g)" -v "$PWD:/src:ro" -v "$PWD/_supplemental-receipts:/out:rw" ubuntu:24.04 /src/target/debug/gba-supplemental qualify /out/qualification 2>&1 | tee _supplemental-receipts/qualification.log
          target/debug/gba-supplemental verify _supplemental-receipts/qualification/good
          target/debug/gba-supplemental reanalyze _supplemental-receipts/qualification/good _supplemental-receipts/reanalysis.json
      - name: Observe the shipped reference and baseline on the original ARM fixture
        shell: bash
        run: |
          set -euo pipefail
          target/debug/gba-supplemental counter-rom _supplemental-receipts/counter.gba
          target/debug/gba-supplemental case --rom _supplemental-receipts/counter.gba > _supplemental-receipts/case.json
          for specimen in reference/mesen.wasm candidates/gba-core/gba_core_shim.wasm; do
            name="$(basename "${specimen%.wasm}")"
            timeout 180 docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 2g --memory-swap 2g --cpus 2 --pids-limit 64 --tmpfs /tmp:rw,noexec,nosuid,size=64m --user "$(id -u):$(id -g)" -v "$PWD:/src:ro" -v "$PWD/_supplemental-receipts:/out:rw" ubuntu:24.04 /src/target/debug/gba-supplemental run --candidate "/src/$specimen" --rom /out/counter.gba --case /out/case.json --out "/out/$name" 2>&1 | tee "_supplemental-receipts/$name.log"
            target/debug/gba-supplemental verify "_supplemental-receipts/$name"
            cat "_supplemental-receipts/$name/measurements.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: supplemental-evidence-${{ github.sha }}
          path: _supplemental-receipts/
          retention-days: 14
          if-no-files-found: error
